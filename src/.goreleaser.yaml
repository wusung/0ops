version: 2

project_name: 0ops

before:
  hooks:
    - go test ./...

builds:
  - id: 0ops
    main: ./cmd/cli
    binary: 0ops
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/winshare/zeroops/internal/shared.Version={{ .Version }}

  - id: 0ops-mcp
    main: ./cmd/mcp
    binary: 0ops-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/winshare/zeroops/internal/shared.Version={{ .Version }}

  - id: 0ops-server
    main: ./cmd/server
    binary: 0ops-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/winshare/zeroops/internal/shared.Version={{ .Version }}

archives:
  - ids:
      - 0ops
      - 0ops-mcp
      - 0ops-server
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

# supply-chain-security spec § 4.1 涵蓋對象 (c): CLI / MCP / server binary
# SBOM (CycloneDX via goreleaser's built-in syft) attached to the GitHub
# Release. Per-archive so each artifact carries its own dependency manifest.
sboms:
  - id: archive-sbom
    artifacts: archive

# supply-chain-security spec § 4.4 (ADR-0017 § 3.3): cosign keyless signature
# of the checksums file (covers every released binary transitively). Requires
# cosign on PATH (sigstore/cosign-installer in release.yml) and id-token:write
# for the GitHub OIDC → Fulcio → Rekor flow. key-based fallback is the離線退路
# whose private key is covered by docs/runbooks/signing-key-rotation.md.
signs:
  - cmd: cosign
    signature: ${artifact}.sig
    certificate: ${artifact}.pem
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}
    artifacts: checksum
    output: true

release:
  github:
    owner: wusung
    name: 0ops
