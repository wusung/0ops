# air 熱重載設定（僅 cmd/server 之 dev stage 使用）
# 來源：docs/features/dev-environment/spec.md § 5.3、§ 6.1

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o tmp/0ops-server ./cmd/server"
  bin = "tmp/0ops-server"
  full_bin = "tmp/0ops-server"
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  exclude_dir = ["tmp", "bin", "dist", "docs", ".git", ".github"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"
