# production-deployment spec § 7 — observability child app（kustomize）。
# 跑 prometheus alert / recording rules + grafana dashboards（已存於 deploy/gitops/observability）。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wusung/0ops.git
    targetRevision: main
    path: deploy/gitops/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
