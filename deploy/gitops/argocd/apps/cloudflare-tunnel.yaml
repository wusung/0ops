# production-deployment spec § 7 — cloudflare-tunnel child app。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflare-tunnel
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wusung/0ops.git
    targetRevision: main
    path: deploy/chart/cloudflare-tunnel
    helm:
      releaseName: cloudflared
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflare-tunnel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
