# production-deployment spec § 7 — ops-server backend child app。
# Production-specific 值（PROD_API_HOST、image tag）為 fork-and-edit；ArgoCD 不做 env substitution。
# 若 host 改變，fork 後修 ingress.host / config.publicURL 兩處（單來源更新 deploy/server/values-prod.yaml 是後續工作）。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ops-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wusung/0ops.git
    targetRevision: main
    path: deploy/server
    helm:
      releaseName: ops-server
      parameters:
        - name: ingress.host
          value: api.winshare.tw
        - name: config.publicURL
          value: https://api.winshare.tw
        - name: config.domainBase
          value: winshare.tw
        - name: image.repository
          value: ghcr.io/wusung/0ops-server
        - name: image.tag
          value: v0.1.3
        - name: migrations.image.repository
          value: ghcr.io/wusung/0ops-migrations
        - name: migrations.image.tag
          value: v0.1.3
  destination:
    server: https://kubernetes.default.svc
    namespace: system-0ops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
