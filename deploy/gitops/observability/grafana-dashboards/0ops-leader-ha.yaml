apiVersion: v1
kind: ConfigMap
metadata:
  name: zeroops-dashboard-leader-ha
  labels:
    grafana_dashboard: "1"
data:
  leader-ha.json: |
    {
      "title": "0ops Leader / HA",
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {
          "type": "timeseries",
          "title": "Leader Status by Pod",
          "targets": [{"expr": "zeroops_leader_status"}]
        },
        {
          "type": "timeseries",
          "title": "Leader Handover Rate (1h)",
          "targets": [{"expr": "sum(rate(zeroops_leader_handover_total[1h]))"}]
        }
      ]
    }
