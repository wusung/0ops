apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-pg-hba
  namespace: {{ .Values.namespace | quote }}
  labels:
    app.0ops.io/managed-by: 0ops
data:
  pg_hba.conf: |
    # TYPE  DATABASE        USER         ADDRESS          METHOD
    # Replication slot used by postgres-replica (cross-pod)
    host    replication     replicator   10.0.0.0/8       scram-sha-256
    host    replication     replicator   172.16.0.0/12    scram-sha-256
    host    replication     replicator   192.168.0.0/16   scram-sha-256
    # Application traffic — backend in same K3s cluster
    host    all             ops          10.0.0.0/8       scram-sha-256
    host    all             ops          172.16.0.0/12    scram-sha-256
    host    all             ops          192.168.0.0/16   scram-sha-256
    # Dump user (read-only) used by pg_dump CronJob
    host    all             dumper       10.0.0.0/8       scram-sha-256
    host    all             dumper       172.16.0.0/12    scram-sha-256
    host    all             dumper       192.168.0.0/16   scram-sha-256
    # Local socket for in-pod tooling (pg_basebackup, psql)
    local   all             all                           trust
    host    all             all          127.0.0.1/32     trust
