{{- /*
postgres-app-credentials Secret is materialised out-of-band per
docs/features/secrets-management spec § 4 (A class). This template renders a
placeholder only when .Values.auth.renderPlaceholder is true (default false),
which is solely for local podman-compose drills.
*/ -}}
{{- if .Values.auth.renderPlaceholder }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.credentialsSecret | quote }}
  namespace: {{ .Values.namespace | quote }}
  labels:
    app.0ops.io/managed-by: 0ops
type: Opaque
stringData:
  app_user: ops
  app_password: change-me
  replication_user: replicator
  replication_password: change-me
  dump_user: dumper
  dump_password: change-me
{{- end }}
