apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudflared-default
  namespace: {{ .Values.namespace | quote }}
spec:
  podSelector:
    matchLabels:
      app: cloudflared
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 7844
        - protocol: UDP
          port: 7844
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.traefik.namespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.traefik.port }}
    # cloudflared resolves region/feature endpoints (cfd-features.argotunnel.com,
    # region1.v2.argotunnel.com) via cluster DNS before falling back — without
    # this, every pod blocks on a DNS timeout it can never recover from.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
