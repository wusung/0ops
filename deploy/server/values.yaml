# 0ops backend chart — values
# Spec：docs/features/backend-ha-leader-election/spec.md
#
# Hard rules from spec § 14 enforced by templates / chart_test.go:
#   #1  M5+ backend 必跑 leader election；replicas >= 2
#   #2  Lease 必使用 K8s Lease object（Role 只允 coordination.k8s.io/leases，
#       且 resourceName 限 0ops-backend-leader）
#   #3  LeaseDuration / RenewDeadline / RetryPeriod 為 15s / 10s / 2s；變更需 ADR
#   #4  ReleaseOnCancel: true（硬寫於 internal/server/leader.LeaseLeader.Run）
#   #5  Production 必走 lease mode；dev compose 才走 always
#   #7  preStop 必含 sleep ≥ 5s
#   #10 同時刻單一 leader；多 leader 由 zeroops_leader_status sum>1 alert 偵測

namespace: system-0ops

image:
  # 由 release workflow images job 發佈（.github/workflows/release.yml）。
  repository: ghcr.io/wusung/0ops-server
  tag: "v0.1.3"
  pullPolicy: IfNotPresent

# Migrations Job（Helm pre-install/pre-upgrade hook；ArgoCD 映射 PreSync）。
# goose up 冪等；DATABASE_URL 取自 secretRef（sealed-secrets unseal 產物）。
migrations:
  enabled: true
  image:
    repository: ghcr.io/wusung/0ops-migrations
    tag: "v0.1.3"
    pullPolicy: IfNotPresent

# Hard rule #1：M5+ 必 ≥ 2；render-time guard 在 templates/deployment.yaml
replicas: 2

strategy:
  maxSurge: 1
  maxUnavailable: 0

terminationGracePeriodSeconds: 60

preStop:
  # Hard rule #7：必 ≥ 5；render-time guard 在 templates/deployment.yaml
  sleepSeconds: 5

leaderElection:
  # Hard rule #1 / #5：production 必 lease；render-time guard 在 templates/deployment.yaml
  mode: lease
  leaseName: 0ops-backend-leader
  namespace: system-0ops

service:
  type: ClusterIP
  port: 8080

serviceAccount:
  name: ops-server

probes:
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1
    memory: 512Mi

# spec § 7.1: rolling update only requires that pods can be re-scheduled;
# preferred anti-affinity keeps them on different nodes when possible
# without making the deployment unschedulable on a single-node K3s.
podAntiAffinityWeight: 100

env: []

# production-deployment spec § 6 — ingress / config / secretRef
ingress:
  enabled: true
  className: traefik
  host: ""              # render-time guard：production 必填，如 api.jesontech.com
  path: /
  pathType: Prefix

config:
  publicURL: ""         # render-time guard：production 必填，如 https://api.jesontech.com
  domainBase: "jesontech.com"
  gitopsRepo: "git@github.com:wusung/0ops-gitops.git"

# Backend 從這個 Secret envFrom 取 GITHUB_OAUTH_CLIENT_ID/SECRET、DATABASE_URL 等。
# Secret 物件由 sealed-secrets controller 在 cluster 內 unseal 產生；
# 本 chart 不渲明文 Secret，避免 commit 風險（spec § 10）。
secretRef:
  name: ops-server-env
