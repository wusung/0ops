name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Match dev compose (postgres:17-alpine) so migrations + queries
      # exercise the same schema in CI as on developer machines.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ops_dev_pw
          POSTGRES_DB: ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache: true
          cache-dependency-path: src/go.sum

      # Pinned to the same goose version as deploy/migrations Dockerfile
      # (src/migrations/Dockerfile § builder) so CI migrations match prod.
      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.22.1

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://ops:ops_dev_pw@localhost:5432/ops?sslmode=disable
        run: goose -dir src/migrations postgres "$DATABASE_URL" up

      - name: go test
        env:
          # internal/server/db smoke tests pick this up via resolveTestDatabaseURL();
          # previously CI ran with DATABASE_URL unset so DB tests SKIPped,
          # masking the cli_token expires_at NOT NULL bug fixed in PR #113.
          TEST_DATABASE_URL: postgres://ops:ops_dev_pw@localhost:5432/ops?sslmode=disable
        run: ./manage.sh test

      - name: task-runner self-tests
        run: ./manage.sh task-runner-test
