# podman compose v2 入口（root）。
# 服務拓樸：db (healthy) → migrate (completed_successfully) → server (healthy)
# 詳見 docs/features/dev-environment/spec.md § 5

name: 0ops

services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ops_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-ops}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: localhost/0ops-migrations:runtime
    build:
      context: ./src
      dockerfile: migrations/Dockerfile
    command: ["${DATABASE_URL}", "up"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # Local image registry for ADR-0012 local-build dev path. Dev only;
  # production never reaches this service. Server reaches it as
  # `registry:5000` via compose DNS; host-side `pack push` (running through
  # the mounted podman socket) reaches it as `localhost:5000`.
  registry:
    image: docker.io/library/registry:2
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:5000/v2/"]
      interval: 10s
      timeout: 3s
      retries: 5

  server:
    image: localhost/0ops-server:dev
    build:
      context: ./src
      dockerfile: cmd/server/Dockerfile
      target: dev
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPS_LISTEN_ADDR: ${OPS_LISTEN_ADDR:-:8080}
      OPS_LOG_LEVEL: ${OPS_LOG_LEVEL:-debug}
      OPS_CALLBACK_SECRET: ${OPS_CALLBACK_SECRET:-dev-callback-secret-change-me}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET}
      # Dev bypass: skip create_app preview's GitHub App install check so the
      # make-dev walkthrough works without a real GitHub App installation.
      # Spec docs/features/create-app-flow/spec.md § 5.1 step 2 / § 15 hard
      # rule #7 — production must leave this unset.
      GITHUB_APP_DISABLE_INSTALL_CHECK: ${GITHUB_APP_DISABLE_INSTALL_CHECK:-true}
      K3S_DISABLE_ISOLATION: ${K3S_DISABLE_ISOLATION:-true}
      CF_DISABLE_TUNNEL: ${CF_DISABLE_TUNNEL:-true}
      # ADR-0012 local-file-repo dev mode. Production must leave OPS_ENV
      # at production and the three LOCAL_* vars blank; server boot panics
      # on conflict (internal/shared/runtime.AssertProductionSafe).
      OPS_ENV: ${OPS_ENV:-development}
      LOCAL_FILE_REPO_ENABLED: ${LOCAL_FILE_REPO_ENABLED:-true}
      LOCAL_BUILD_ENABLED: ${LOCAL_BUILD_ENABLED:-true}
      # M5.6.1: LOCAL_REGISTRY is what the *host podman engine* sees when
      # pushing — localhost:5000 maps to the registry container's published
      # host port. Server-internal HTTP probes (none today) would use the
      # compose DNS name `registry:5000` instead.
      LOCAL_REGISTRY: ${LOCAL_REGISTRY:-localhost:5000}
      LOCAL_FILE_REPO_ROOT: /workspace/examples
      OPS_PUBLIC_BASE_URL: ${OPS_PUBLIC_BASE_URL:-http://server:8080}
      # ADR-0012 LocalBuildDispatcher: pack exec'd inside the server
      # container talks to the host podman daemon via the mounted socket.
      # Socket path must be IDENTICAL inside and outside the server
      # container — pack mounts whatever DOCKER_HOST points to into the
      # lifecycle ephemeral container (spawned by host podman) at the same
      # path, so they have to agree.
      DOCKER_HOST: unix:///run/user/${UID:-1000}/podman/podman.sock
      # T7/T8 app-source-ingestion: server requires INGEST_ROOT to store
      # uploaded tarballs and BUILD_TOKEN_SECRET to sign the fetch JWT used
      # by the GHA workflow. Dev defaults are intentionally weak; production
      # must set both via secret manager.
      APP_SOURCE_INGEST_ROOT: /var/lib/0ops/ingest
      OPS_BUILD_TOKEN_SECRET: ${OPS_BUILD_TOKEN_SECRET:-dev-build-token-secret-change-me}
    ports:
      - "${OPS_HOST_PORT:-8080}:8080"
    volumes:
      - ./src:/app:Z
      - go-mod-cache:/go/pkg/mod
      - ./examples:/workspace/examples:Z
      # podman socket mount for LocalBuildDispatcher. High-trust mount;
      # ADR-0012 § 6 — production compose must NOT carry this. Path matches
      # host so pack's lifecycle container sees the same socket via bind.
      - /run/user/${UID:-1000}/podman/podman.sock:/run/user/${UID:-1000}/podman/podman.sock:Z
      # T8/T9 app-source-ingestion: ingest root for uploaded tarballs.
      - ingest-data:/var/lib/0ops/ingest:Z
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      registry:
        condition: service_healthy

volumes:
  pgdata:
  go-mod-cache:
  ingest-data:
