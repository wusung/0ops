# podman compose v2 入口（root）。
# 服務拓樸：db (healthy) → migrate (completed_successfully) → server (healthy)
# 詳見 docs/features/dev-environment/spec.md § 5

name: 0ops

services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ops_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-ops}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: localhost/0ops-migrations:runtime
    build:
      context: .
      dockerfile: migrations/Dockerfile
    command: ["${DATABASE_URL}", "up"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  server:
    image: localhost/0ops-server:dev
    build:
      context: .
      dockerfile: cmd/server/Dockerfile
      target: dev
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPS_LISTEN_ADDR: ${OPS_LISTEN_ADDR:-:8080}
      OPS_LOG_LEVEL: ${OPS_LOG_LEVEL:-debug}
      OPS_CALLBACK_SECRET: ${OPS_CALLBACK_SECRET:-dev-callback-secret-change-me}
    ports:
      - "${OPS_HOST_PORT:-8080}:8080"
    volumes:
      - .:/app:Z
      - go-mod-cache:/go/pkg/mod
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  go-mod-cache:
